  # ============================================
  # 基础服务与 IoT 专用端口
  # ============================================
  # NTP服务 (设备时间同步)
  - DST-PORT,123
  # SSDP / UPnP (局域网设备发现)
  - DST-PORT,1900
  # mDNS (局域网域名解析，如 .local)
  - DST-PORT,5353
  # ONVIF (通用安防摄像头协议)
  - DST-PORT,3702
  # 海康威视专用端口
  - DST-PORT,8000
  # RTSP (视频流传输协议)
  - DST-PORT,554
  # 小米 IoT 本地控制端口
  - DST-PORT,7681
  # CoAP (受限应用协议)
  - DST-PORT,5683

  # ============================================
  # 工业控制与光伏 / 储能专用端口
  # ============================================
  # Modbus TCP (逆变器/BMS/电表局域网通信)
  - DST-PORT,502
  # MQTT (IoT 设备标准通信流)
  - DST-PORT,1883
  # MQTT over SSL (加密的 IoT 通信)
  - DST-PORT,8883

  # ============================================
  # IoT / 智能家居硬件商常见域名直连
  # ============================================
  # 四色光伏 (太阳能与储能采集器)
